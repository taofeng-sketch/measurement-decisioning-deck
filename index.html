<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Protected strategy deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@500;700&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f0ebde;--ink:#1f2be0;--grid:rgba(31,43,224,.10);--viewer:#c9c3b6}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--viewer);color:var(--ink)}
    body.locked{height:100vh;overflow:hidden;display:grid;place-items:center;background-color:var(--paper);background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px),linear-gradient(to bottom,var(--grid) 1px,transparent 1px);background-size:44px 44px}
    body.locked:before,body.locked:after{content:'';position:fixed;left:4%;right:4%;height:2px;background:var(--ink)}body.locked:before{top:28px}body.locked:after{bottom:24px}
    .gate{width:min(850px,88vw);border:2px solid var(--ink);background:rgba(240,235,222,.92);padding:54px;font-family:'Hanken Grotesk',sans-serif}
    .kicker{font:500 15px/1 'DM Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
    h1{font:400 clamp(56px,8vw,98px)/.92 'Newsreader',serif;letter-spacing:-.025em;margin:34px 0 24px}
    .gate p{font-size:19px;line-height:1.45;max-width:650px}
    form{display:grid;grid-template-columns:1fr auto;margin-top:34px;border-top:2px solid var(--ink);padding-top:28px}
    input,button{border:2px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:500 18px 'DM Mono',monospace;padding:17px 18px}input{border-right:0;min-width:0}button{cursor:pointer;background:var(--ink);color:var(--paper);padding-inline:28px}.error{min-height:26px;margin-top:18px;font:500 14px 'DM Mono',monospace;letter-spacing:.04em}
    .viewer{display:none;width:100%;min-height:100vh;background:var(--viewer)}body.unlocked .viewer{display:block}body.unlocked .gate{display:none}
    .pages{width:min(1600px,100%);margin:0 auto;padding:24px 18px 80px}
    .sheet{margin:0 0 28px;background:var(--paper);border:1px solid rgba(31,43,224,.34);aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}
    .sheet img{display:block;width:100%;height:100%;object-fit:contain;background:var(--paper)}
    .loader{font:500 13px 'DM Mono',monospace;letter-spacing:.08em;color:var(--ink);opacity:.65}.sheet.loaded .loader{display:none}
    .counter{position:fixed;right:max(18px,env(safe-area-inset-right));top:max(18px,env(safe-area-inset-top));z-index:20;background:var(--ink);color:var(--paper);padding:10px 14px;font:500 13px/1 'DM Mono',monospace;letter-spacing:.08em}
    .top{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;width:44px;height:44px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);display:grid;place-items:center;text-decoration:none;font:600 22px/1 sans-serif}
    @media(max-width:720px){.gate{padding:32px 24px}form{grid-template-columns:1fr}input{border-right:2px solid var(--ink);border-bottom:0}.pages{padding:10px 0 54px}.sheet{margin-bottom:10px;border-left:0;border-right:0}.counter{top:10px;right:10px;padding:8px 10px;font-size:11px}.top{right:10px;bottom:10px}}
  </style>
</head>
<body class="locked">
  <main class="gate">
    <div class="kicker">Fifty5Blue / protected strategy discussion</div>
    <h1>Ground truth<br>as a growth engine</h1>
    <p>Enter the shared password. Pages are decrypted locally and loaded as you scroll.</p>
    <form id="gate"><input id="password" type="password" autocomplete="current-password" autofocus placeholder="Password" aria-label="Password"><button>OPEN</button></form>
    <div class="error" id="error" aria-live="polite"></div>
  </main>
  <div class="viewer" id="viewer">
    <div class="counter" id="counter">01 / 18</div><a class="top" href="#top" aria-label="Back to top">↑</a>
    <main class="pages" id="top"><figure class="sheet" data-page="1"><span class="loader">PAGE 01 / 18</span></figure><figure class="sheet" data-page="2"><span class="loader">PAGE 02 / 18</span></figure><figure class="sheet" data-page="3"><span class="loader">PAGE 03 / 18</span></figure><figure class="sheet" data-page="4"><span class="loader">PAGE 04 / 18</span></figure><figure class="sheet" data-page="5"><span class="loader">PAGE 05 / 18</span></figure><figure class="sheet" data-page="6"><span class="loader">PAGE 06 / 18</span></figure><figure class="sheet" data-page="7"><span class="loader">PAGE 07 / 18</span></figure><figure class="sheet" data-page="8"><span class="loader">PAGE 08 / 18</span></figure><figure class="sheet" data-page="9"><span class="loader">PAGE 09 / 18</span></figure><figure class="sheet" data-page="10"><span class="loader">PAGE 10 / 18</span></figure><figure class="sheet" data-page="11"><span class="loader">PAGE 11 / 18</span></figure><figure class="sheet" data-page="12"><span class="loader">PAGE 12 / 18</span></figure><figure class="sheet" data-page="13"><span class="loader">PAGE 13 / 18</span></figure><figure class="sheet" data-page="14"><span class="loader">PAGE 14 / 18</span></figure><figure class="sheet" data-page="15"><span class="loader">PAGE 15 / 18</span></figure><figure class="sheet" data-page="16"><span class="loader">PAGE 16 / 18</span></figure><figure class="sheet" data-page="17"><span class="loader">PAGE 17 / 18</span></figure><figure class="sheet" data-page="18"><span class="loader">PAGE 18 / 18</span></figure></main>
  </div>
  <script>
    const meta={salt:'9vByVseA9r6LzD2W6jqjww==',pages:[{"page":1,"file":"pages/slide_01.bin","iv":"iviDeQ+RwgFg7Xff"},{"page":2,"file":"pages/slide_02.bin","iv":"rLqSePKnCQLyX3aG"},{"page":3,"file":"pages/slide_03.bin","iv":"+LRJdAxjzm2nf5rk"},{"page":4,"file":"pages/slide_04.bin","iv":"G9Un4i1EdoRoqWVS"},{"page":5,"file":"pages/slide_05.bin","iv":"9V6Df56PAX6nTCmW"},{"page":6,"file":"pages/slide_06.bin","iv":"d7u+Jn/VfKXdkQjH"},{"page":7,"file":"pages/slide_07.bin","iv":"Glb2wvpRYYsAcwB3"},{"page":8,"file":"pages/slide_08.bin","iv":"NEHHV1bOOm3qwUev"},{"page":9,"file":"pages/slide_09.bin","iv":"mI9RJ7JrhXR3x4/C"},{"page":10,"file":"pages/slide_10.bin","iv":"tlBnYQrgssydFR9e"},{"page":11,"file":"pages/slide_11.bin","iv":"iAiLPmQ9sHebYgWD"},{"page":12,"file":"pages/slide_12.bin","iv":"G1z1W+vHh1VoDQvL"},{"page":13,"file":"pages/slide_13.bin","iv":"QzFU3z6UpVEhx5be"},{"page":14,"file":"pages/slide_14.bin","iv":"t0DQt++gygYEKrJV"},{"page":15,"file":"pages/slide_15.bin","iv":"rh+3zCBUlbIqaoeQ"},{"page":16,"file":"pages/slide_16.bin","iv":"qEyFpwNZKtWD9Foq"},{"page":17,"file":"pages/slide_17.bin","iv":"Y3yheNIT970OHCbF"},{"page":18,"file":"pages/slide_18.bin","iv":"Lb1gfCLBggNc8ouo"}]};
    const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let deckKey=null;const loaded=new Set();
    async function decryptPage(index){
      if(loaded.has(index))return;const p=meta.pages[index];const res=await fetch(p.file,{cache:'force-cache'});if(!res.ok)throw new Error('Page fetch failed');
      const encrypted=await res.arrayBuffer();const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(p.iv)},deckKey,encrypted);
      const url=URL.createObjectURL(new Blob([clear],{type:'image/png'}));const sheet=document.querySelector('.sheet[data-page="'+p.page+'"]');const img=new Image();img.alt='Strategy deck page '+p.page+' of 18';img.width=1920;img.height=1080;img.onload=()=>sheet.classList.add('loaded');img.src=url;sheet.appendChild(img);loaded.add(index);
    }
    gate.addEventListener('submit',async e=>{e.preventDefault();error.textContent='DECRYPTING…';
      try{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.value),'PBKDF2',false,['deriveKey']);deckKey=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(meta.salt),iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);await decryptPage(0);document.body.className='unlocked';error.textContent='';startViewer();}
      catch(_){deckKey=null;error.textContent='PASSWORD NOT RECOGNIZED';password.select();}
    });
    function startViewer(){
      const sheets=[...document.querySelectorAll('.sheet')];
      const lazy=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)decryptPage(Number(e.target.dataset.page)-1).catch(()=>{});}),{rootMargin:'1400px 0px'});sheets.forEach(s=>lazy.observe(s));
      const pageObs=new IntersectionObserver(entries=>{const v=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];if(v)counter.textContent=String(Number(v.target.dataset.page)).padStart(2,'0')+' / 18';},{threshold:[.2,.45,.7]});sheets.forEach(s=>pageObs.observe(s));
    }
  </script>
</body></html>
